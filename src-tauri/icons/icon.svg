<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="NEXUS">
  <!--
    NEXUS — o SINAL-N, variante BOLD para o bundle (v1.3 COCKPIT).

    Mesma geometria do design-system/NexusMark.tsx, um tico mais cheia para o
    icone do app que vive a 32px e a 16px: o N em traco de sinal (fosforo) num
    squircle grafite, com dois nos acesos na diagonal. Traco w=16, nos r=13.

    ATENCAO: este e o VETOR-FONTE. Os rasters do bundle (.ico/.png/.icns e o set
    Square*Logo.png) sao regerados na entrega (fase 7) via `tauri icon`.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12181B"/>
      <stop offset="100%" stop-color="#070A0B"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="232" height="232" rx="56" fill="url(#plate)"/>
  <rect x="4" y="4" width="232" height="232" rx="56" fill="none" stroke="#2C4A40" stroke-width="2" opacity="0.8"/>

  <!-- os aneis de no (a luz acesa) -->
  <circle cx="84" cy="76" r="20" fill="none" stroke="#33E1A0" stroke-width="3" opacity="0.35"/>
  <circle cx="156" cy="164" r="20" fill="none" stroke="#33E1A0" stroke-width="3" opacity="0.35"/>

  <!-- o traco do N -->
  <path d="M84 164 L84 76 L156 164 L156 76" fill="none" stroke="#33E1A0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- os nos acesos, na diagonal do sinal -->
  <circle cx="84" cy="76" r="13" fill="#33E1A0"/>
  <circle cx="156" cy="164" r="13" fill="#33E1A0"/>
</svg>
