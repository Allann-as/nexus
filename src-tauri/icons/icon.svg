<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- NEXUS mark: an "N" drawn as one continuous stroke inside an indigo
       squircle. Flat fill, no gradient, geometric — legible down to 16px.
       Corner radius is 22% of the side, which reads as a squircle at every
       size without needing a superellipse path. -->
  <rect width="512" height="512" rx="114" ry="114" fill="#7C8CF8"/>
  <path d="M168 356 V156 L344 356 V156"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="40"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
