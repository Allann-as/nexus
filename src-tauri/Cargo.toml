[package]
name = "nexus"
version = "0.1.0"
description = "NEXUS — Personal Operating System"
authors = ["Allan"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix keeps the lib name unique so it does not conflict with the
# bin name on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence. `bundled` compiles SQLite into the binary so the engine version
# never depends on what the host OS happens to ship.
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
rusqlite_migration = "2"

uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"

# Hash de conteúdo para anexos (integridade + dedup) e, no M5, para os backups.
# Puro Rust, sem rede — o SHA-256 é calculado localmente sobre os bytes.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
