[package]
name = "nexus"
version = "0.1.0"
description = "NEXUS — Personal Operating System"
authors = ["Allan"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix keeps the lib name unique so it does not conflict with the
# bin name on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` para a bandeja do Windows; `image-png` para carregar o ícone PNG da
# bandeja a partir dos bytes embarcados (ARSENAL — ADR-0065).
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
# Atalho global (Ctrl+Shift+N) — a Captura Rápida com o app em segundo plano. Usado
# SÓ do lado Rust (handler no setup); a webview não ganha permissão de plugin, então
# a allowlist de capabilities segue mínima (ADR-0065).
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence. `bundled` compiles SQLite into the binary so the engine version
# never depends on what the host OS happens to ship.
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.31"
rusqlite_migration = "2"

uuid = { version = "1", features = ["v7", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"

# Hash de conteúdo para anexos (integridade + dedup) e, no M5, para os backups.
# Puro Rust, sem rede — o SHA-256 é calculado localmente sobre os bytes.
sha2 = "0.10"

# Backup (M5): empacota o snapshot do banco num zip, com AES-256 opcional. Puro
# Rust (deflate + aes/hmac/pbkdf2), sem rede — o mesmo princípio de longevidade
# do resto. `default-features = false` evita puxar bzip2/zstd/time que não usamos.
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }

[dev-dependencies]
tempfile = "3"
# O teste de ciclo de backup constrói um zip "corrompido" à mão para provar que o
# quick_check o recusa. Mesma versão da dependência normal — sem custo extra.
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
