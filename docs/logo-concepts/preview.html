<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS — 3 conceitos de logo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { font-size: 13px; opacity: 0.6; margin: 0 0 28px; }
  section { padding: 40px 32px; }
  .dark { background: #0a1120; color: #edf2fc; }
  .light { background: #f4f6fb; color: #0c1424; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; max-width: 1100px; }
  .card { border-radius: 16px; padding: 24px; }
  .dark .card { background: #0e1729; border: 1px solid #1b2942; }
  .light .card { background: #ffffff; border: 1px solid #e4e9f2; }
  .marks { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
  .marks img.sym { width: 88px; height: 88px; }
  .marks img.sq { width: 92px; height: 92px; border-radius: 22px; }
  .name { font-size: 15px; font-weight: 620; margin: 0 0 6px; }
  .meaning { font-size: 12.5px; line-height: 1.55; opacity: 0.72; margin: 0; }
  .n { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.45; margin: 0 0 3px; }
</style>
</head>
<body>
  <section class="dark">
    <h1>NEXUS — três conceitos de logo</h1>
    <p class="sub">Fundo escuro (Midnight). Cada conceito: símbolo puro + ícone no squircle índigo.</p>
    <div class="grid" id="grid-dark"></div>
  </section>
  <section class="light">
    <h1>NEXUS — três conceitos de logo</h1>
    <p class="sub">Fundo claro (tema derivado). Os mesmos arquivos, para conferir o contraste nos dois temas.</p>
    <div class="grid" id="grid-light"></div>
  </section>

  <script>
    const concepts = [
      {
        n: "01",
        name: "Constelação-N",
        sym: "01-constelacao-n-symbol.svg",
        sq: "01-constelacao-n-squircle.svg",
        meaning: "As esferas da vida são pontos; as linhas que as ligam desenham a letra N. A vida como um grafo de nós conectados — e o NEXUS é o nó central, no cruzamento, que liga todos os outros.",
      },
      {
        n: "02",
        name: "Núcleo radiante",
        sym: "02-nucleo-radiante-symbol.svg",
        sq: "02-nucleo-radiante-squircle.svg",
        meaning: "Um centro do qual cinco ramos partem em ângulos precisos de pentágono — a árvore da vida abstraída em geometria, e o mesmo sunburst com que o app visualiza a vida. Tecnologia sem ser cyber: pura ordem geométrica.",
      },
      {
        n: "03",
        name: "Convergência",
        sym: "03-convergencia-symbol.svg",
        sq: "03-convergencia-squircle.svg",
        meaning: "Linhas de direções distintas se fundem num único ponto de junção — nexus no sentido latino literal (o elo, o ponto onde se atam). Um traço contínuo atravessa o cruzamento e segue: o que se une, continua como um só.",
      },
    ];
    function render(id) {
      document.getElementById(id).innerHTML = concepts.map((c) => `
        <div class="card">
          <p class="n">${c.n}</p>
          <div class="marks">
            <img class="sym" src="${c.sym}" alt="${c.name} símbolo">
            <img class="sq" src="${c.sq}" alt="${c.name} ícone">
          </div>
          <p class="name">${c.name}</p>
          <p class="meaning">${c.meaning}</p>
        </div>`).join("");
    }
    render("grid-dark");
    render("grid-light");
  </script>
</body>
</html>
