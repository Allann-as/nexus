<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Constelação-N">
  <!-- Os três traços do N desenhados como arestas de um grafo -->
  <g fill="none" stroke="#4d8dff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 92 L34 28"/>
    <path d="M34 28 L86 92"/>
    <path d="M86 92 L86 28"/>
  </g>
  <!-- As esferas da vida nos vértices -->
  <circle cx="34" cy="28" r="7" fill="#34d399"/>
  <circle cx="34" cy="92" r="7" fill="#38bdf8"/>
  <circle cx="86" cy="28" r="7" fill="#fbbf24"/>
  <circle cx="86" cy="92" r="7" fill="#ec4899"/>
  <!-- O nexo: o nó central que liga tudo, no meio da diagonal -->
  <circle cx="60" cy="60" r="11" fill="#1e4fd8"/>
  <circle cx="60" cy="60" r="5" fill="#bcd6ff"/>
  <circle cx="60" cy="60" r="11" fill="none" stroke="#7eb2ff" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>
