<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Convergência">
  <!-- Direções distintas que se fundem no ponto de junção -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M92 28 L60 60" stroke="#ec4899"/>
    <path d="M28 92 L60 60" stroke="#38bdf8"/>
    <path d="M60 22 L60 60" stroke="#34d399"/>
    <path d="M98 60 L60 60" stroke="#fbbf24"/>
    <path d="M22 60 L60 60" stroke="#a78bfa"/>
  </g>
  <!-- O traço contínuo: o nexo que atravessa e segue -->
  <path d="M26 26 L94 94" fill="none" stroke="#4d8dff" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Pequenos nós de origem -->
  <circle cx="92" cy="28" r="4.5" fill="#ec4899"/>
  <circle cx="28" cy="92" r="4.5" fill="#38bdf8"/>
  <circle cx="60" cy="22" r="4.5" fill="#34d399"/>
  <circle cx="98" cy="60" r="4.5" fill="#fbbf24"/>
  <circle cx="22" cy="60" r="4.5" fill="#a78bfa"/>
  <!-- O ponto de junção — nexus, no sentido latino literal -->
  <circle cx="60" cy="60" r="12" fill="#1e4fd8"/>
  <circle cx="60" cy="60" r="5.5" fill="#bcd6ff"/>
  <circle cx="60" cy="60" r="12" fill="none" stroke="#7eb2ff" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>
