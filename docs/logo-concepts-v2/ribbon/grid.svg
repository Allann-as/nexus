<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="NEXUS">
<defs>
    <linearGradient id="r-left" x1="0" y1="0" x2="1" y2="1.2">
      <stop offset="0%" stop-color="#A7B4FB"/>
      <stop offset="55%" stop-color="#7C8CF8"/>
      <stop offset="100%" stop-color="#5D6BDC"/>
    </linearGradient>
    <linearGradient id="r-diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5D6BDC"/>
      <stop offset="50%" stop-color="#414FB4"/>
      <stop offset="100%" stop-color="#2B3585"/>
    </linearGradient>
    <linearGradient id="r-right" x1="0" y1="0" x2="1" y2="1.2">
      <stop offset="0%" stop-color="#CAD3FF"/>
      <stop offset="55%" stop-color="#A7B4FB"/>
      <stop offset="100%" stop-color="#7C8CF8"/>
    </linearGradient>
    <radialGradient id="r-nexus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEF1FF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#CAD3FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#CAD3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

    <g stroke="#414FB4" stroke-width="0.5" opacity="0.5" fill="none">
      <rect x="66" y="66" width="108" height="108"/>
      <line x1="66" y1="66" x2="174" y2="174"/>
      <line x1="120" y1="66" x2="120" y2="174"/>
      <line x1="66" y1="120" x2="174" y2="120"/>
      <circle cx="120" cy="120" r="26"/>
    </g>
    <g>
      <polygon points="66,66 96,66 174,174 144,174" fill="url(#r-diag)"/>
      <polygon points="66,66 96,66 96,174 66,174" fill="url(#r-left)"/>
      <polygon points="144,66 174,66 174,174 144,174" fill="url(#r-right)"/>
      <path d="M96,66 L174,174" stroke="#1B2258" stroke-width="1" opacity="0.4"/>
      <path d="M66,66 L144,174" stroke="#CAD3FF" stroke-width="0.9" opacity="0.55"/>
      <path d="M96,66 L96,92" stroke="#CAD3FF" stroke-width="0.9" opacity="0.5"/>
      <path d="M144,174 L144,148" stroke="#1B2258" stroke-width="0.9" opacity="0.4"/>
      <!-- brilho de topo em cada poste: a luz bate na quina de cima -->
      <path d="M66,67.2 L96,67.2" stroke="#EEF1FF" stroke-width="1.4" opacity="0.7" stroke-linecap="round"/>
      <path d="M144,67.2 L174,67.2" stroke="#EEF1FF" stroke-width="1.4" opacity="0.85" stroke-linecap="round"/>
      <!-- o nexo: o cruzamento no centro -->
      <circle cx="120" cy="120" r="26" fill="url(#r-nexus)"/>
      <circle cx="120" cy="120" r="3.1" fill="#EEF1FF"/>
    </g>
</svg>
