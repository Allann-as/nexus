<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="NEXUS">
  <!--
    NEXUS — a BUSSOLA, variante BOLD para o bundle (v1.2, ADR-0069).

    Mesma geometria do design-system/NexusMark.tsx, engrossada: o icone do app
    vive a 32px e a 16px, onde traco fino vira cinza. Anel r=98 (w=5), rosa com
    pontas em r=82 e cintura em r=30, pivo r=11. Oito marcas cardeais, nao
    sessenta: a graduacao existe para dizer "instrumento", e para de existir
    antes de virar ruido.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B3585"/>
      <stop offset="100%" stop-color="#10163A"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="232" height="232" rx="58" fill="url(#plate)"/>
  <rect x="4" y="4" width="232" height="232" rx="58" fill="none" stroke="#414FB4" stroke-width="2" opacity="0.55"/>

  <circle cx="120" cy="120" r="98" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.3"/>

  <g stroke="#FFFFFF" stroke-linecap="round">
    <line x1="120" y1="22"  x2="120" y2="36"  stroke-width="7" opacity="0.85"/>
    <line x1="218" y1="120" x2="204" y2="120" stroke-width="7" opacity="0.85"/>
    <line x1="120" y1="218" x2="120" y2="204" stroke-width="7" opacity="0.85"/>
    <line x1="22"  y1="120" x2="36"  y2="120" stroke-width="7" opacity="0.85"/>
    <line x1="189.30" y1="50.70"  x2="183.64" y2="56.36"  stroke-width="4.5" opacity="0.4"/>
    <line x1="189.30" y1="189.30" x2="183.64" y2="183.64" stroke-width="4.5" opacity="0.4"/>
    <line x1="50.70"  y1="189.30" x2="56.36"  y2="183.64" stroke-width="4.5" opacity="0.4"/>
    <line x1="50.70"  y1="50.70"  x2="56.36"  y2="56.36"  stroke-width="4.5" opacity="0.4"/>
  </g>

  <!-- a rosa dos ventos inteira -->
  <path d="M120,38 L141.21,98.79 L202,120 L141.21,141.21 L120,202 L98.79,141.21 L38,120 L98.79,98.79 Z"
        fill="#FFFFFF" opacity="0.45"/>
  <!-- a agulha do norte, o unico acento do desenho -->
  <path d="M120,38 L141.21,98.79 L120,120 L98.79,98.79 Z" fill="#FFFFFF"/>

  <circle cx="120" cy="120" r="11" fill="#10163A"/>
  <circle cx="120" cy="120" r="11" fill="none" stroke="#FFFFFF" stroke-width="4"/>
</svg>
