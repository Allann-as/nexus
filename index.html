<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <!-- Set here as well as in CSS so the very first frame paints in the app's
         colour instead of a white flash. -->
    <style>
      html {
        background: #060809;
      }
      html[data-theme="light"] {
        background: #eef1f2;
      }

      /* Splash: o SINAL-N pinta antes do React montar. Mesma geometria do
         `NexusMark` (N em x∈[84,156], y∈[76,164]; nós de raio 12) — três
         desenhos, uma geometria só. O React limpa o #root ao montar, então
         este bloco some sozinho no primeiro render. Só opacity/transform
         animam (a §6 do design system), e o movimento respeita
         prefers-reduced-motion. */
      .nx-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 22px;
        background:
          radial-gradient(56% 52% at 50% 42%, rgba(51, 225, 160, 0.1), transparent 70%),
          radial-gradient(120% 120% at 30% 20%, #0b1113, #050708);
      }
      html[data-theme="light"] .nx-splash {
        background:
          radial-gradient(56% 52% at 50% 42%, rgba(14, 159, 110, 0.12), transparent 70%),
          radial-gradient(120% 120% at 30% 20%, #ffffff, #e7ecec);
      }
      .nx-splash svg {
        animation: nx-splash-in 0.6s ease both;
      }
      .nx-splash .nx-splash-core {
        transform-origin: center;
        animation: nx-splash-pulse 2.4s ease-in-out infinite;
      }
      .nx-splash figcaption {
        font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", monospace;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.28em;
        color: #33e1a0;
        animation: nx-splash-in 0.6s ease 0.1s both;
      }
      @keyframes nx-splash-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes nx-splash-pulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @media (prefers-reduced-motion: reduce) {
        .nx-splash svg,
        .nx-splash .nx-splash-core,
        .nx-splash figcaption {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <figure class="nx-splash" aria-label="NEXUS">
        <svg width="112" height="112" viewBox="0 0 240 240" fill="none">
          <defs>
            <linearGradient id="s-plate" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#12181B" />
              <stop offset="100%" stop-color="#070A0B" />
            </linearGradient>
            <radialGradient id="s-halo" cx="50%" cy="50%" r="50%">
              <stop offset="30%" stop-color="#33E1A0" stop-opacity="0.4" />
              <stop offset="66%" stop-color="#33E1A0" stop-opacity="0.11" />
              <stop offset="100%" stop-color="#33E1A0" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- o halo, que vaza por fora do squircle -->
          <circle cx="120" cy="120" r="118" fill="url(#s-halo)" />

          <!-- o squircle grafite -->
          <rect x="16" y="16" width="208" height="208" rx="58" fill="url(#s-plate)" />
          <rect x="16" y="16" width="208" height="208" rx="58" fill="none" stroke="#2C4A40" stroke-width="1.5" opacity="0.8" />

          <!-- os anéis de nó (a luz acesa) -->
          <circle cx="84" cy="76" r="19" fill="none" stroke="#33E1A0" stroke-width="2.5" opacity="0.35" />
          <circle cx="156" cy="164" r="19" fill="none" stroke="#33E1A0" stroke-width="2.5" opacity="0.35" />

          <!-- o traço do N -->
          <path d="M84 164 L84 76 L156 164 L156 76" fill="none" stroke="#33E1A0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

          <!-- os nós acesos, na diagonal do sinal (o que pulsa) -->
          <g class="nx-splash-core">
            <circle cx="84" cy="76" r="12" fill="#33E1A0" />
            <circle cx="156" cy="164" r="12" fill="#33E1A0" />
          </g>
        </svg>
        <figcaption>NEXUS</figcaption>
      </figure>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
