<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <!-- Set here as well as in CSS so the very first frame paints in the app's
         colour instead of a white flash. -->
    <style>
      html {
        background: #0c0d10;
      }
      html[data-theme="light"] {
        background: #f7f8fa;
      }

      /* Splash: a bússola pinta antes do React montar. Mesma geometria do
         `NexusMark` (centro 120, anel 96, pontas 76, cintura 26) — três
         desenhos, uma geometria só. O React limpa o
         #root ao montar, então este bloco some sozinho no primeiro render.
         Só opacity/transform animam (a §6 do design system), e o movimento
         respeita prefers-reduced-motion. */
      .nx-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 22px;
        background:
          radial-gradient(60% 55% at 50% 42%, rgba(124, 140, 248, 0.12), transparent 70%),
          radial-gradient(120% 120% at 30% 20%, #141a38, #080b1a);
      }
      html[data-theme="light"] .nx-splash {
        background:
          radial-gradient(60% 55% at 50% 42%, rgba(124, 140, 248, 0.16), transparent 70%),
          radial-gradient(120% 120% at 30% 20%, #ffffff, #eef0f8);
      }
      .nx-splash svg {
        animation: nx-splash-in 0.6s ease both;
      }
      .nx-splash .nx-splash-core {
        transform-origin: center;
        animation: nx-splash-pulse 2.4s ease-in-out infinite;
      }
      .nx-splash figcaption {
        font-family: system-ui, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: #a7b4fb;
        animation: nx-splash-in 0.6s ease 0.1s both;
      }
      @keyframes nx-splash-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes nx-splash-pulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @media (prefers-reduced-motion: reduce) {
        .nx-splash svg,
        .nx-splash .nx-splash-core,
        .nx-splash figcaption {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <figure class="nx-splash" aria-label="NEXUS">
        <svg width="112" height="112" viewBox="0 0 240 240" fill="none">
          <defs>
            <linearGradient id="s-plate" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2B3585" />
              <stop offset="100%" stop-color="#10163A" />
            </linearGradient>
            <radialGradient id="s-halo" cx="50%" cy="50%" r="50%">
              <stop offset="35%" stop-color="#7C8CF8" stop-opacity="0.42" />
              <stop offset="70%" stop-color="#7C8CF8" stop-opacity="0.12" />
              <stop offset="100%" stop-color="#7C8CF8" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- o halo, que vaza por fora do squircle -->
          <circle cx="120" cy="120" r="118" fill="url(#s-halo)" />

          <!-- o squircle índigo -->
          <rect x="16" y="16" width="208" height="208" rx="60" fill="url(#s-plate)" />
          <rect x="16" y="16" width="208" height="208" rx="60" fill="none" stroke="#414FB4" stroke-width="1.5" opacity="0.55" />

          <!-- o anel e as oito marcas cardeais -->
          <circle cx="120" cy="120" r="96" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.3" />
          <g stroke="#FFFFFF" stroke-linecap="round">
            <line x1="120" y1="24" x2="120" y2="37" stroke-width="5" opacity="0.85" />
            <line x1="216" y1="120" x2="203" y2="120" stroke-width="5" opacity="0.85" />
            <line x1="120" y1="216" x2="120" y2="203" stroke-width="5" opacity="0.85" />
            <line x1="24" y1="120" x2="37" y2="120" stroke-width="5" opacity="0.85" />
            <line x1="187.88" y1="52.12" x2="182.93" y2="57.07" stroke-width="3" opacity="0.4" />
            <line x1="187.88" y1="187.88" x2="182.93" y2="182.93" stroke-width="3" opacity="0.4" />
            <line x1="52.12" y1="187.88" x2="57.07" y2="182.93" stroke-width="3" opacity="0.4" />
            <line x1="52.12" y1="52.12" x2="57.07" y2="57.07" stroke-width="3" opacity="0.4" />
          </g>

          <!-- a rosa dos ventos, e por cima dela a agulha do norte -->
          <path
            d="M120,44 L138.38,101.62 L196,120 L138.38,138.38 L120,196 L101.62,138.38 L44,120 L101.62,101.62 Z"
            fill="#FFFFFF"
            opacity="0.45"
          />
          <path d="M120,44 L138.38,101.62 L120,120 L101.62,101.62 Z" fill="#FFFFFF" />

          <!-- o pivô: o furo por onde a agulha gira, e o que pulsa -->
          <g class="nx-splash-core">
            <circle cx="120" cy="120" r="9" fill="#10163A" />
            <circle cx="120" cy="120" r="9" fill="none" stroke="#FFFFFF" stroke-width="3" />
          </g>
        </svg>
        <figcaption>NEXUS</figcaption>
      </figure>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
